[package]
name = "bindings"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "bindings"
path = "src/lib.rs"

[features]
default = ["dictionary", "mucab", "tesseract", "tts", "pdf", "odt", "transliterate", "image-render", "pdf-image-translate", "doc-align", "ppocr", "planar-tracker"]
dictionary = ["translator/dictionary"]
mucab = ["translator/mucab"]
tesseract = ["translator/tesseract"]
tts = ["translator/tts"]
pdf = ["translator/pdf"]
odt = ["translator/odt"]
transliterate = ["translator/transliterate"]
image-render = ["translator/image-render"]
pdf-image-translate = ["translator/pdf-image-translate"]
doc-align = ["translator/doc-align"]
ppocr = ["translator/ppocr"]
planar-tracker = ["translator/planar-tracker"]

[dependencies]
adblock = { version = "0.12.2", default-features = false, features = ["full-regex-handling", "embedded-domain-resolver"] }
serde_json = "1"
uniffi = { version = "0.29", default-features = false }
thiserror = "2"
log = "0.4"
xml5ever = "0.38"
markup5ever = "0.38"
# Used for the live-OCR DirectByteBuffer fast-path: a hand-rolled JNI shim
# that copies bytes from a camera DirectByteBuffer straight into a FrameHandle's
# Rust-owned Vec<u8>, skipping the JVM ByteArray round-trip uniffi would
# otherwise force on us.
jni = { version = "0.21", default-features = false }

[dependencies.translator]
default-features = false
# git = "https://github.com/DavidVentura/translator-rs.git"
path = "/home/david/git/translator-rs"
features = ["uniffi", "html"]
# NOTE: gradle's `buildBindingsAarch64` task fingerprints files inside
# `app/src/main/bindings/` only — it does NOT track this path dependency.
# If you edit translator-rs/src/*.rs and run `./gradlew :app:assembleDebug`,
# gradle will report UP-TO-DATE and the old libbindings.so ships. Force a
# rebuild via:
#     touch app/src/main/bindings/src/uniffi_catalog.rs && \
#     ./gradlew :app:buildBindingsAarch64 --rerun-tasks
# or any edit inside `app/src/main/bindings/src/` (it's the bindings src
# dir that's part of the fingerprint).

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.14", default-features = false }

# [patch."https://github.com/DavidVentura/slimt-sys"]
# slimt-sys = { path = "/home/david/git/slimt-sys" }

# [patch."https://github.com/DavidVentura/piper-rs"]
# piper-rs = { path = "/home/david/git/piper-rs" }
#
# [patch."https://github.com/DavidVentura/mnn-sys"]
# mnn-sys = { path = "/home/david/git/mnn-sys" }

# cache-buster: bump this comment after editing translator-rs to force a rebuild
# (gradle's inputs.dir only watches bindings/src, not the path = ".." translator crate).
# rev: 8

[profile.release]
lto = "thin"
codegen-units = 2
debug = false
strip = "debuginfo"
